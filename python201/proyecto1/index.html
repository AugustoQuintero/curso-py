<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ruta Turística Más Cercana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
        }
        label, input {
            display: block;
            margin-top: 10px;
        }
        button {
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }
        pre {
            background-color: #ecf0f1;
            padding: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>Buscar Ruta Turística Más Cercana</h1>
    <label for="lat">Latitud:</label>
    <input type="number" id="lat" step="any" placeholder="Ej: 4.3">

    <label for="lon">Longitud:</label>
    <input type="number" id="lon" step="any" placeholder="Ej: -74.8">

    <button onclick="buscarRuta()">Buscar</button>

    <h2>Resultado:</h2>
    <pre id="resultado">Esperando búsqueda...</pre>

    <script>
        async function buscarRuta() {
            const lat = document.getElementById('lat').value;
            const lon = document.getElementById('lon').value;

            if (!lat || !lon) {
                alert("Por favor ingresa latitud y longitud.");
                return;
            }

            const url = `http://127.0.0.1:8000/ricaurte/rutas/cercana?lat=${lat}&lon=${lon}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Error al consultar la API.");
                }

                document.getElementById('resultado').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('resultado').textContent = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
